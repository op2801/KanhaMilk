<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Account - Kanha Dairy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
        }

        /* Dashboard layout */
        .dashboard {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Sidebar - modern collapsible with smooth transition */
        .sidebar {
            width: 260px;
            background: white;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            flex-shrink: 0;
            z-index: 100;
            overflow-x: hidden;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
        }

        /* Desktop collapsed state: width 70px (only icons visible) */
        @media (min-width: 769px) {
            .sidebar.collapsed {
                width: 70px;
            }
            .sidebar.collapsed .menu-text {
                display: none;
            }
            .sidebar.collapsed .sidebar-menu a {
                justify-content: center;
                padding: 12px 0;
                gap: 0;
            }
            .sidebar.collapsed .sidebar-menu a i {
                margin: 0;
                font-size: 1.4rem;
            }
            .sidebar.collapsed .toggle-nav-btn .menu-text {
                display: inline-block; /* Keep "Menu" text hidden? better show only icon, but we will hide text for toggle too */
            }
            .sidebar.collapsed .toggle-nav-btn .menu-text {
                display: none;
            }
            .sidebar.collapsed .sidebar-menu a:hover {
                padding-left: 0;
                background-color: #3b82f6;
            }
        }

        /* Mobile sidebar: uses transform (off-canvas) */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 260px;
                z-index: 1050;
                box-shadow: none;
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 8px 0 25px rgba(0, 0, 0, 0.2);
            }
            /* mobile never uses collapsed class for width, only transform */
            .sidebar.collapsed {
                width: 260px;
                transform: translateX(-100%);
            }
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 24px 12px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.25s ease;
            cursor: pointer;
            border-radius: 14px;
            margin: 2px 0;
            white-space: nowrap;
        }

        .sidebar-menu a i {
            width: 26px;
            font-size: 1.2rem;
            text-align: center;
            transition: transform 0.2s;
        }

        .sidebar-menu a:hover {
            background-color: rgba(59, 130, 246, 0.2);
            color: white;
            transform: translateX(4px);
        }

        .sidebar-menu a.active {
            background: linear-gradient(95deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 6px 12px -6px rgba(59,130,246,0.4);
        }

        /* special toggle button inside sidebar */
        .toggle-nav-btn {
            background: rgba(255,215,0,0.12);
            margin-bottom: 16px;
            border: 1px solid rgba(255,215,0,0.3);
            font-weight: 600;
        }
        .toggle-nav-btn i {
            font-size: 1.3rem;
        }
        .toggle-nav-btn:hover {
            background: #ffd700;
            color: #0f172a !important;
            transform: translateX(0) !important;
        }

        /* Main content */
        .main-content {
            flex: 1;
            background-color: #f8fafc;
            padding: 24px 32px;
            transition: all 0.3s ease;
        }

        .shop-card {
            background: white;
            border-radius: 28px;
            padding: 28px 32px;
            text-align: center;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 32px;
            backdrop-filter: blur(2px);
            transition: transform 0.2s;
        }

        #shopBtn {
            background: linear-gradient(105deg, #3b82f6, #1e40af);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        #shopBtn:hover {
            transform: scale(1.02);
            background: linear-gradient(105deg, #2563eb, #1e3a8a);
            box-shadow: 0 8px 18px rgba(59,130,246,0.4);
        }

        .history {
            background: white;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.06);
            border: 1px solid #eef2ff;
            min-height: 400px;
        }

        .order-card, .saved-card {
            background: #ffffff;
            border-left: 5px solid #facc15;
            padding: 18px 20px;
            margin-bottom: 16px;
            border-radius: 20px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid #edf2f7;
        }

        .order-card:hover, .saved-card:hover {
            transform: translateX(6px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.1);
            border-left-color: #3b82f6;
        }

        .order-id {
            font-weight: 800;
            color: #0f172a;
            font-size: 1rem;
        }

        .order-date {
            font-size: 0.75rem;
            color: #5b6e8c;
            margin-bottom: 6px;
        }

        .order-total {
            color: #15803d;
            font-weight: 700;
            margin-top: 6px;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #e2e8f0;
            margin-top: 8px;
        }

        .status.delivered {
            background: #dcfce7;
            color: #166534;
        }

        .status.processing {
            background: #fff3e3;
            color: #c2410c;
        }

        .empty-message {
            text-align: center;
            color: #5f6c84;
            padding: 48px 20px;
        }

        .empty-message i {
            font-size: 3.2rem;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .help-content {
            line-height: 1.8;
        }

        .help-content i {
            width: 32px;
            color: #facc15;
        }

        .remove-saved {
            background: none;
            border: none;
            color: #dc2626;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .remove-saved:hover {
            color: #b91c1c;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 16px;
            }
            .shop-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="sidebar collapsed" id="sidebar">
        <div class="sidebar-menu">
            <a id="toggleNavBtn" class="toggle-nav-btn" style="cursor: pointer;">
                <i class="fas fa-bars"></i>
                <span class="menu-text"> Menu</span>
            </a>
            <a data-nav="home">
                <i class="fa-solid fa-house"></i>
                <span class="menu-text"> Home</span>
            </a>
            <a data-nav="orders" class="active">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="menu-text"> My Orders</span>
            </a>
            <a data-nav="saved">
                <i class="fa-solid fa-heart"></i>
                <span class="menu-text"> Saved Items</span>
            </a>
            <a data-nav="help">
                <i class="fa-solid fa-circle-question"></i>
                <span class="menu-text"> Help & Support</span>
            </a>
            <a data-nav="logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="menu-text"> Logout</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="shop-card">
            <button type="button" id="shopBtn">🛒 Shop Now — Fresh Dairy Delights</button>
        </div>
        <div class="history" id="historyContainer">
            <!-- Dynamic content loaded via JS -->
        </div>
    </div>
</div>

<script>

    function initData() {
        if (!localStorage.getItem('kanha_orders')) {
            localStorage.setItem('kanha_orders', JSON.stringify([]));  // Absolutely empty, no demo data
        }
        if (!localStorage.getItem('kanha_saved')) {
            localStorage.setItem('kanha_saved', JSON.stringify([]));
        }
    }

    function getOrders() {
        return JSON.parse(localStorage.getItem('kanha_orders')) || [];
    }

    function getSavedItems() {
        return JSON.parse(localStorage.getItem('kanha_saved')) || [];
    }

    // Helper: save orders
    function saveOrders(orders) {
        localStorage.setItem('kanha_orders', JSON.stringify(orders));
    }

    // Display My Orders
    function showOrders() {
        const container = document.getElementById('historyContainer');
        const orders = getOrders();
        if (orders.length === 0) {
            container.innerHTML = `<div class="empty-message">
                <i class="fa-solid fa-box-open fa-3x"></i>
                <p style="margin-top: 12px;">✨ No orders yet. Click <strong>"Shop Now"</strong> to bring home farm-fresh milk, paneer & more!</p>
                <small class="text-muted">Your dairy journey starts here 🥛</small>
            </div>`;
            return;
        }
        let html = `<h4 style="font-weight: 700;"><i class="fa-solid fa-truck-fast me-2"></i> Your Order History</h4><hr class="mb-3">`;
        orders.forEach(order => {
            let itemsList = order.items.map(item => `${item.name} x${item.qty} = ₹${item.price * item.qty}`).join(' • ');
            html += `
                <div class="order-card">
                    <div class="order-id"><i class="fa-regular fa-receipt"></i> Order #${order.id}</div>
                    <div class="order-date"><i class="fa-regular fa-calendar-alt"></i> ${order.date}</div>
                    <div class="mt-1">📦 ${itemsList}</div>
                    <div class="order-total">💰 Total: ₹${order.total}</div>
                    <span class="status ${order.status}">${order.status === 'delivered' ? '✓ Delivered' : '⏳ Processing'}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    
    function showSavedItems() {
        const container = document.getElementById('historyContainer');
        let saved = getSavedItems();
        if (saved.length === 0) {
            container.innerHTML = `<div class="empty-message">
                <i class="fa-regular fa-heart fa-3x"></i>
                <p>Your wishlist is empty 💔<br>Save your favourite milk, curd, or ghee products while shopping!</p>
            </div>`;
            return;
        }
        let html = `<h4><i class="fa-solid fa-heart text-danger me-2"></i> Saved Items</h4><hr>`;
        saved.forEach(item => {
            html += `
                <div class="saved-card d-flex justify-content-between align-items-center flex-wrap">
                    <div>
                        <i class="fa-solid fa-cart-shopping me-2 text-primary"></i> 
                        <strong>${escapeHtml(item.name)}</strong> - ₹${item.price}
                    </div>
                    <button class="remove-saved btn-sm mt-2 mt-sm-0" data-id="${item.id}"><i class="fa-regular fa-trash-can"></i> Remove</button>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.remove-saved').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                let savedItems = getSavedItems();
                savedItems = savedItems.filter(item => item.id !== id);
                localStorage.setItem('kanha_saved', JSON.stringify(savedItems));
                showSavedItems();
                // Optional: update active nav highlight
                setActiveNav('saved');
            });
        });
    }

    // simple escape to avoid XSS
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    function showHelpSupport() {
        const container = document.getElementById('historyContainer');
        container.innerHTML = `
            <div class="help-content">
                <h4><i class="fa-solid fa-headset"></i> Help & Support</h4>
                <hr>
                <p><i class="fa-solid fa-phone-alt"></i> <strong>Customer Care:</strong> +91 62692 20670 (Mon-Sat, 6 AM - 8 PM)</p>
                <p><i class="fa-regular fa-envelope"></i> <strong>Email:</strong> support@kanhadairy.com</p>
                <p><i class="fa-brands fa-whatsapp"></i> <strong>WhatsApp:</strong> +91 98765 43210</p>
                <p><i class="fa-regular fa-clock"></i> <strong>Service Hours:</strong> 6:00 AM - 8:00 PM (Sunday 7 AM - 6 PM)</p>
                <div class="alert alert-warning mt-3" style="background:#fff8e7; border-radius: 20px;">
                    <i class="fa-regular fa-message"></i> For order-related queries, share your Order ID. We deliver happiness 🥛✨
                </div>
            </div>
        `;
    }

    function logout() {
        if (confirm('Log out from Kanha Dairy? You can always come back!')) {
            // Clear any session-like behavior but keep orders/wishlist (persistent)
            window.location.href = 'index.html';
        }
    }

    function goHome() {
        window.location.href = 'index.html';
    }

    function setActiveNav(activeNav) {
        document.querySelectorAll('.sidebar-menu a[data-nav]').forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('data-nav') === activeNav) {
                link.classList.add('active');
            }
        });
    }

  
    const sidebar = document.getElementById('sidebar');
    const toggleButton = document.getElementById('toggleNavBtn');

    
    function toggleSidebar() {
        if (window.innerWidth <= 768) {
           
            sidebar.classList.toggle('open');
        } else {
            sidebar.classList.toggle('collapsed');
        }
    }

  
    function setInitialSidebarClosed() {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('open');   // hidden by transform
            // ensure no collapsed on mobile (not needed)
            sidebar.classList.remove('collapsed');
        } else {
         
            sidebar.classList.add('collapsed');
            sidebar.classList.remove('open');
        }
    }

    // Handle window resize to reset sidebar visual mode (avoid glitches)
    function handleResize() {
        if (window.innerWidth <= 768) {
            sidebar.classList.remove('collapsed');
            if (!sidebar.classList.contains('open') && sidebar.style.transform !== 'translateX(0px)') {
                // ensure closed state but don't override user interaction
                if (!sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                }
            }
        } else {
            
            sidebar.classList.remove('open');
            if (!sidebar.classList.contains('collapsed') && !sidebar.classList.contains('open')) {
                sidebar.classList.add('collapsed');
            }
        }
    }

    
    document.querySelectorAll('.sidebar-menu a[data-nav]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.stopPropagation();
            const navAction = link.getAttribute('data-nav');
            if (navAction === 'home') {
                goHome();
            } else if (navAction === 'orders') {
                setActiveNav('orders');
                showOrders();
                // On mobile, after navigation close sidebar automatically
                if (window.innerWidth <= 768) sidebar.classList.remove('open');
            } else if (navAction === 'saved') {
                setActiveNav('saved');
                showSavedItems();
                if (window.innerWidth <= 768) sidebar.classList.remove('open');
            } else if (navAction === 'help') {
                setActiveNav('help');
                showHelpSupport();
                if (window.innerWidth <= 200) sidebar.classList.remove('open');
            } else if (navAction === 'logout') {
                logout();
            }
        });
    });
    
    if (toggleButton) {
        toggleButton.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleSidebar();
        });
    }

    // Shop now button -> product page
    document.getElementById('shopBtn').addEventListener('click', () => {
        window.location.href = 'product.html';
    });

    
    document.querySelector('.main-content')?.addEventListener('click', function(e) {
        if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
            // If user clicks on main content area, close sidebar
            sidebar.classList.remove('open');
        }
    });

   
    initData();
    setInitialSidebarClosed();
    // Default view: show orders (empty state friendly)
    showOrders();
    setActiveNav('orders');

    // Re-attach resize event to handle orientation change
    window.addEventListener('resize', () => {
        handleResize();
    });
   
    window.addEventListener('storage', (e) => {
        if (e.key === 'kanha_orders' && document.querySelector('.sidebar-menu a.active[data-nav="orders"]')) {
            // if orders page is active, refresh view
            showOrders();
        } else if (e.key === 'kanha_orders') {
            // if not active but background, optional
            if (document.querySelector('.sidebar-menu a.active[data-nav="orders"]')) showOrders();
        }
        if (e.key === 'kanha_saved' && document.querySelector('.sidebar-menu a.active[data-nav="saved"]')) {
            showSavedItems();
        }
    });
    
   
    window.addEventListener('pageshow', () => {
        const activeNavElem = document.querySelector('.sidebar-menu a.active');
        if (activeNavElem) {
            const nav = activeNavElem.getAttribute('data-nav');
            if (nav === 'orders') showOrders();
            else if (nav === 'saved') showSavedItems();
            else if (nav === 'help') showHelpSupport();
        } else {
            showOrders();
        }
        // ensure sidebar stays closed on page reload/back
        setInitialSidebarClosed();
    });
</script>
</body>
</html>
